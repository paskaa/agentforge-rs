constraints: |
  ## 数据库约束
  - 所有 DDL 变更必须通过迁移脚本（sql/迁移记录-DB变更记录/）
  - ⚠️ 迁移脚本文件名必须包含对应 BUG 编号，格式: YYYYMMDD_fix_BUG#XXXX_description.sql
  - 表名使用小写 + 下划线
  - 所有新增列必须有 COMMENT
  - 复杂查询用 CTE 或子查询，避免嵌套过深
  - 涉及索引变更先评估现有查询计划
